services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: radiocare
    ports:
      - "3307:3306"
    volumes:
      - radiocare_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ""
    ports:
      - "8081:80"

  # A mail server for development.
  #
  # It accepts everything the application sends and shows it in a web
  # page at http://localhost:8025 instead of delivering it. That makes
  # the whole approval flow testable, and the message can be read
  # exactly as the patient would receive it, without needing an account
  # at a mail provider.
  #
  # To deliver to real inboxes, point the SMTP settings at a real
  # provider instead. Nothing else in the application changes.
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  radiocare_mariadb_data:
